{% extends "emails/base_email.html" %}
{% block content %}
  <p style="margin:0 0 16px;">Hi {{ first_name }},</p>
  <p style="margin:0 0 16px;">Thanks for signing up. Confirm your email address to finish setting up your account.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0;">
    <tr>
      <td style="border-radius:6px;background:linear-gradient(90deg,#8b5cf6,#ec4899);background-color:#a855f7;">
        <a href="{{ verify_url }}" style="display:inline-block;padding:13px 28px;color:#ffffff;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;">Verify Email</a>
      </td>
    </tr>
  </table>
  <p style="margin:0 0 8px;">If the button doesn't work, copy and paste this link into your browser:</p>
  <p style="word-break:break-all;margin:0;"><a href="{{ verify_url }}" style="color:#7c3aed;">{{ verify_url }}</a></p>
{% endblock %}
