<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background-color:#f4f2fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #ece7f7;">
            <tr>
              <td style="background-color:#150f2e;padding:28px 32px;" align="center">
                <img src="{{ logo_url }}" width="40" height="40" alt="User Management System" style="display:block;margin:0 auto 10px;border-radius:8px;" />
                <span style="color:#ffffff;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;">User Management System</span>
              </td>
            </tr>
            <tr>
              <td style="height:4px;line-height:4px;font-size:0;background:linear-gradient(90deg,#8b5cf6,#ec4899);background-color:#a855f7;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:36px 32px;color:#1f2937;font-size:15px;line-height:1.65;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;color:#8b8496;font-size:12px;background-color:#faf9fc;border-top:1px solid #ece7f7;">
                If you didn't request this, you can safely ignore this email.
              </td>
            </tr>
          </table>
          <p style="color:#a39cb5;font-size:11px;margin-top:20px;">&copy; {% now "Y" %} User Management System</p>
        </td>
      </tr>
    </table>
  </body>
</html>
